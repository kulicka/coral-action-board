# Fly config for a separate, personal deployment of the board (its own app, volume and secrets).

app = 'kulicka-personal-board'
primary_region = 'iad'

[build]

[env]
  DB_PATH = '/data/board.db'
  PORT = '8080'
  SEED = 'personal'
  PUBLIC_URL = 'https://kulicka-personal-board.fly.dev'

[[mounts]]
  source = 'personal_board_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
